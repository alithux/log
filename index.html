<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Taxi Earnings Tracker</title>
  <!-- iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taxi Earnings">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric-line/180/000000/taxi.png">
  
  <style>
    :root {
      --bg-color: #12181b;
      --card-bg: #1e272c;
      --accent-green: #2ecc71;
      --accent-hover: #27ae60;
      --danger-red: #e74c3c;
      --text-main: #f5f6fa;
      --text-sub: #a4b0be;
      --button-bg: #2c3e50;
      --button-active: #34495e;
      --border-color: #2f3640;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    }

    /* Header & Total Section */
    header {
      padding: 16px 0 12px 0;
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .total-display {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1.1;
    }

    .trip-count {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* Main Action Grid */
    .fare-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
      flex-grow: 1;
    }

    .btn-fare {
      background-color: var(--button-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85px;
      cursor: pointer;
      transition: transform 0.05s ease, background-color 0.1s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn-fare:active {
      transform: scale(0.96);
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #fff;
    }

    .btn-fare .currency {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .btn-fare:active .currency {
      color: #fff;
    }

    .btn-custom {
      grid-column: span 2;
      background-color: #34495e;
      border-color: #455a64;
    }

    /* Notification Flash */
    .flash-banner {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background-color: var(--accent-green);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }

    .flash-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Recent Trips / History Sheet */
    .history-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--danger-red);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .history-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .history-amount {
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-delete-item {
      background: none;
      border: none;
      color: var(--danger-red);
      font-size: 1.2rem;
      padding: 0 8px;
      cursor: pointer;
    }

    /* Custom Input Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 2000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      max-width: 320px;
      text-align: center;
    }

    .modal-title {
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .custom-input {
      width: 100%;
      background: var(--bg-color);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 2rem;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
    }

    .custom-input:focus {
      border-color: var(--accent-green);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--button-bg);
      color: var(--text-main);
    }

    .btn-confirm {
      background: var(--accent-green);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Flash Banner Notification -->
  <div id="flashBanner" class="flash-banner">+MVR 0 Added</div>

  <!-- Header Section -->
  <header>
    <div class="subtitle">Today's Total Earnings</div>
    <div class="total-display"><span style="font-size: 1.8rem; font-weight: 500;">MVR</span> <span id="todayTotal">0</span></div>
    <div class="trip-count"><span id="tripCount">0</span> trips recorded today</div>
  </header>

  <!-- Quick Fare Action Buttons -->
  <main class="fare-grid">
    <button class="btn-fare" onclick="recordFare(30)"><span class="currency">MVR</span>30</button>
    <button class="btn-fare" onclick="recordFare(70)"><span class="currency">MVR</span>70</button>
    <button class="btn-fare" onclick="recordFare(80)"><span class="currency">MVR</span>80</button>
    <button class="btn-fare" onclick="recordFare(85)"><span class="currency">MVR</span>85</button>
    <button class="btn-fare" onclick="recordFare(100)"><span class="currency">MVR</span>100</button>
    <button class="btn-fare btn-custom" onclick="openCustomModal()">Custom Amount</button>
  </main>

  <!-- Recent History Card -->
  <section class="history-card">
    <div class="history-header">
      <span class="history-title">Today's Log</span>
      <button class="btn-reset" onclick="confirmReset()">Reset Day</button>
    </div>
    <ul class="history-list" id="historyList">
      <!-- Items dynamically injected here -->
    </ul>
  </section>

  <!-- Custom Fare Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-content">
      <div class="modal-title">Enter Custom Fare</div>
      <input type="number" id="customAmountInput" class="custom-input" placeholder="0" inputmode="decimal">
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeCustomModal()">Cancel</button>
        <button class="btn-modal btn-confirm" onclick="submitCustomFare()">Add</button>
      </div>
    </div>
  </div>

  <script>
    // State management
    let trips = JSON.parse(localStorage.getItem('taxi_trips') || '[]');

    // Audio Feedback setup using Web Audio API (no external file downloads needed)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch A5 note
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }

    // Core logic
    function recordFare(amount) {
      if (!amount || amount <= 0) return;

      const newTrip = {
        id: Date.now(),
        amount: Number(amount),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toISOString().split('T')[0]
      };

      trips.unshift(newTrip);
      saveAndUpdateUI();

      // Driver Feedback
      playBeep();
      triggerHaptic();
      showFlash(`+MVR ${amount}`);
    }

    function deleteTrip(id) {
      trips = trips.filter(t => t.id !== id);
      saveAndUpdateUI();
      triggerHaptic();
    }

    function confirmReset() {
      if (confirm("Are you sure you want to clear today's earnings?")) {
        trips = [];
        saveAndUpdateUI();
        triggerHaptic();
      }
    }

    function saveAndUpdateUI() {
      localStorage.setItem('taxi_trips', JSON.stringify(trips));
      render();
    }

    function showFlash(message) {
      const banner = document.getElementById('flashBanner');
      banner.textContent = message;
      banner.classList.add('show');
      setTimeout(() => {
        banner.classList.remove('show');
      }, 1200);
    }

    function render() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todayTrips = trips.filter(t => t.date === todayStr);

      const total = todayTrips.reduce((sum, t) => sum + t.amount, 0);
      document.getElementById('todayTotal').textContent = total.toLocaleString();
      document.getElementById('tripCount').textContent = todayTrips.length;

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (todayTrips.length === 0) {
        historyList.innerHTML = `<li class="history-item" style="color: var(--text-sub); justify-content: center;">No trips logged today yet.</li>`;
        return;
      }

      todayTrips.forEach(trip => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="history-time">${trip.timestamp}</span>
          <div>
            <span class="history-amount">MVR ${trip.amount}</span>
            <button class="btn-delete-item" onclick="deleteTrip(${trip.id})">&times;</button>
          </div>
        `;
        historyList.appendChild(li);
      });
    }

    // Modal controls for Custom Fare
    function openCustomModal() {
      const modal = document.getElementById('customModal');
      const input = document.getElementById('customAmountInput');
      input.value = '';
      modal.classList.add('active');
      setTimeout(() => input.focus(), 100);
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function submitCustomFare() {
      const input = document.getElementById('customAmountInput');
      const val = parseFloat(input.value);
      if (val && val > 0) {
        recordFare(val);
        closeCustomModal();
      }
    }

    // Initial render call
    render();
  </script>
</body>
</html>
