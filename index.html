<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Taxi Earnings Tracker</title>
  
  <!-- Apple Web App Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taxi Earnings">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric-line/180/000000/taxi.png">

  <style>
    :root {
      --bg-dark: #0e1416;
      --card-bg: rgba(26, 38, 36, 0.7);
      --card-border: rgba(46, 204, 113, 0.15);
      --primary-green: #2ecc71;
      --dusky-green: #1b4d3e;
      --accent-emerald: #00b894;
      --text-bright: #f5f6fa;
      --text-muted: #8a99a6;
      --danger-red: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #152b24 0%, #0e1416 75%);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    /* Notification Banner */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, var(--accent-emerald), var(--primary-green));
      color: #0e1416;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Total Earnings Display Box */
    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .dashboard-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .total-amount {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--primary-green);
      letter-spacing: -1px;
      line-height: 1;
    }

    .total-currency {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--accent-emerald);
      margin-right: 4px;
    }

    .stats-subtext {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Driver Buttons Grid */
    .fare-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 18px 0;
    }

    .btn-fare {
      background: linear-gradient(145deg, #182823, #121e1a);
      border: 1px solid rgba(46, 204, 113, 0.2);
      border-radius: 20px;
      color: var(--text-bright);
      padding: 22px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, border-color 0.1s ease;
    }

    .btn-fare:active {
      transform: scale(0.95);
      background: var(--dusky-green);
      border-color: var(--primary-green);
    }

    .btn-fare .amount-val {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }

    .btn-fare .lbl-currency {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .btn-custom {
      grid-column: span 2;
      background: linear-gradient(145deg, #1f3a32, #142822);
      border-color: var(--accent-emerald);
      padding: 18px;
    }

    .btn-custom .amount-val {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* History Drawer */
    .log-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 8px;
    }

    .log-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--danger-red);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .log-list {
      list-style: none;
      max-height: 130px;
      overflow-y: auto;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .log-time {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .log-val {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-bright);
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger-red);
      font-size: 1.2rem;
      margin-left: 12px;
      cursor: pointer;
    }

    /* Custom Input Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #182421;
      border: 1px solid var(--accent-emerald);
      border-radius: 24px;
      width: 88%;
      max-width: 320px;
      padding: 24px;
      text-align: center;
    }

    .modal-input {
      width: 100%;
      background: #0e1416;
      border: 2px solid var(--dusky-green);
      border-radius: 14px;
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
      padding: 12px;
      text-align: center;
      margin: 16px 0;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--primary-green);
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .btn-m {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-m-cancel {
      background: #2a3834;
      color: var(--text-muted);
    }

    .btn-m-add {
      background: var(--primary-green);
      color: #0e1416;
    }
  </style>
</head>
<body>

  <!-- Instant Toast Banner -->
  <div id="toast" class="toast">+MVR 0</div>

  <!-- Top Total Area -->
  <div class="dashboard-card">
    <div class="dashboard-title">Today's Total Earnings</div>
    <div class="total-amount"><span class="total-currency">MVR</span><span id="totalDisplay">0</span></div>
    <div class="stats-subtext"><span id="countDisplay">0</span> trips logged today</div>
  </div>

  <!-- Preset Quick Tap Grid -->
  <div class="fare-grid">
    <button class="btn-fare" onclick="addFare(30)">
      <span class="lbl-currency">MVR</span>
      <span class="amount-val">30</span>
    </button>
    <button class="btn-fare" onclick="addFare(70)">
      <span class="lbl-currency">MVR</span>
      <span class="amount-val">70</span>
    </button>
    <button class="btn-fare" onclick="addFare(80)">
      <span class="lbl-currency">MVR</span>
      <span class="amount-val">80</span>
    </button>
    <button class="btn-fare" onclick="addFare(85)">
      <span class="lbl-currency">MVR</span>
      <span class="amount-val">85</span>
    </button>
    <button class="btn-fare" onclick="addFare(100)">
      <span class="lbl-currency">MVR</span>
      <span class="amount-val">100</span>
    </button>
    <button class="btn-fare btn-custom" onclick="openModal()">
      <span class="amount-val">+ Custom Fare</span>
    </button>
  </div>

  <!-- Today's Log -->
  <div class="log-card">
    <div class="log-header">
      <span class="log-title">Today's History</span>
      <button class="btn-clear" onclick="clearDay()">Clear Day</button>
    </div>
    <ul class="log-list" id="logList"></ul>
  </div>

  <!-- Custom Fare Dialog -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <h3>Custom Fare</h3>
      <input type="number" id="customInput" class="modal-input" placeholder="0" inputmode="decimal">
      <div class="modal-btns">
        <button class="btn-m btn-m-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-m btn-m-add" onclick="submitCustom()">Add Fare</button>
      </div>
    </div>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('mvr_taxi_logs') || '[]');

    // Audio Feedback Context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playAudioFeedback() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function addFare(amount) {
      if (!amount || amount <= 0) return;

      const entry = {
        id: Date.now(),
        amount: Number(amount),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toISOString().split('T')[0]
      };

      logs.unshift(entry);
      saveAndRender();

      playAudioFeedback();
      triggerHaptic();
      showToast(`+MVR ${amount}`);
    }

    function deleteEntry(id) {
      logs = logs.filter(item => item.id !== id);
      saveAndRender();
      triggerHaptic();
    }

    function clearDay() {
      if (confirm("Reset today's logged trips?")) {
        logs = [];
        saveAndRender();
        triggerHaptic();
      }
    }

    function saveAndRender() {
      localStorage.setItem('mvr_taxi_logs', JSON.stringify(logs));
      render();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    }

    function render() {
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = logs.filter(item => item.date === today);

      const total = todayLogs.reduce((acc, item) => acc + item.amount, 0);
      document.getElementById('totalDisplay').textContent = total.toLocaleString();
      document.getElementById('countDisplay').textContent = todayLogs.length;

      const listEl = document.getElementById('logList');
      listEl.innerHTML = '';

      if (todayLogs.length === 0) {
        listEl.innerHTML = `<li class="log-item" style="justify-content:center; color: var(--text-muted); font-size: 0.85rem;">No trips recorded today yet.</li>`;
        return;
      }

      todayLogs.forEach(item => {
        const li = document.createElement('li');
        li.className = 'log-item';
        li.innerHTML = `
          <span class="log-time">${item.time}</span>
          <div>
            <span class="log-val">MVR ${item.amount}</span>
            <button class="btn-del" onclick="deleteEntry(${item.id})">&times;</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function openModal() {
      const modal = document.getElementById('modal');
      const input = document.getElementById('customInput');
      input.value = '';
      modal.classList.add('active');
      setTimeout(() => input.focus(), 100);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function submitCustom() {
      const val = parseFloat(document.getElementById('customInput').value);
      if (val && val > 0) {
        addFare(val);
        closeModal();
      }
    }

    render();
  </script>
</body>
</html>
